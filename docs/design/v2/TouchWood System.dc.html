<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'home' };

  componentDidMount() {
    this._nav = (e) => { const v = e && e.detail; if (v) this.setState({ view: v }); };
    window.addEventListener('tw-nav', this._nav);
    try { this.startFlags(); } catch (err) { console.error('[tw-flags] init failed', err); }
    try {
      const saved = localStorage.getItem('tw-sys-view');
      if (saved && saved !== this.state.view) this.setState({ view: saved });
    } catch (err) {}
  }

  componentWillUnmount() {
    window.removeEventListener('tw-nav', this._nav);
    if (this._flagObs) this._flagObs.disconnect();
  }

  startFlags() {
    const rules = [
      { match: ['مجرى درج سوفت كلوز', 'Soft-close drawer slide'], label: 'الأكثر مبيعاً', en: 'Best seller', tone: 'primary' },
      { match: ['مفصلة باكم 2D', 'BAKM 2D hinge'], label: 'توصيل مجاني', en: 'Free delivery', tone: 'info' },
      { match: ['مقبض لطش حرف L', 'L profile handle'], label: 'جديد', en: 'New', tone: 'secondary' },
      { match: ['اكسسوار درج تخزين متعدد الوظائف', 'SH8122'], label: 'باقي 18 فقط', en: 'Only 18 left', tone: 'urgent' }
    ];
    const isEnglish = () => {
      const root = document.documentElement;
      return root.lang === 'en' || root.dir === 'ltr';
    };
    const applyFlags = () => {
      document.querySelectorAll('#__tw-sys-view .scp8').forEach((card) => {
        const text = card.textContent || '';
        const wanted = rules.filter((rule) => rule.match.some((value) => text.indexOf(value) !== -1));
        if (!wanted.length) return;

        let tray = card.querySelector(':scope > .tw-status-flags');
        if (!tray) {
          tray = document.createElement('div');
          tray.className = 'tw-status-flags';
          tray.setAttribute('aria-label', isEnglish() ? 'Product status' : 'حالة المنتج');
          card.prepend(tray);
        }

        wanted.forEach((rule) => {
          const key = rule.match[0];
          let flag = Array.from(tray.children).find((node) => node.dataset.twFlag === key);
          if (!flag) {
            flag = document.createElement('span');
            flag.dataset.twFlag = key;
            flag.className = 'tw-flag tw-flag--' + rule.tone;
            tray.append(flag);
          }
          flag.textContent = isEnglish() ? rule.en : rule.label;
        });

        // Hide a duplicated legacy best-seller badge when the new flag is present.
        Array.from(card.querySelectorAll('span')).forEach((node) => {
          if (!node.closest('.tw-status-flags') && node.textContent.trim() === 'الأكثر مبيعاً') {
            node.style.display = 'none';
          }
        });
      });
    };

    this._applyFlags = () => {
      try { applyFlags(); } catch (err) { console.error('[tw-flags] apply failed', err); }
    };

    let queued = false;
    try {
      this._flagObs = new MutationObserver(() => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; this._applyFlags(); });
      });
      this._flagObs.observe(document.documentElement, { childList: true, subtree: true });
    } catch (err) { console.error('[tw-flags] observer failed', err); }

    // The SysHome child mounts after the root, so retry across the first frames.
    this._applyFlags();
    [60, 200, 600, 1400].forEach((t) => setTimeout(this._applyFlags, t));
  }

  componentDidUpdate() { if (this._applyFlags) this._applyFlags(); }

  set(view) {
    this.setState({ view });
    try { localStorage.setItem('tw-sys-view', view); } catch (err) {}
  }

  renderVals() {
    const v = this.state.view;
    const on = (k) => ({ bg: v === k ? 'var(--kFFF)' : 'transparent', fg: v === k ? 'var(--k07273E)' : 'var(--kAFC4D6)' });
    const H = on('home'), S = on('store'), A = on('admin');
    return {
      isHome: v === 'home', isStore: v === 'store', isAdmin: v === 'admin',
      homeBg: H.bg, homeFg: H.fg, storeBg: S.bg, storeFg: S.fg, adminBg: A.bg, adminFg: A.fg,
      hint: v === 'admin' ? 'Staff panel · EN / AR' : 'واجهة العميل',
      goHome: () => this.set('home'),
      goStore: () => this.set('store'),
      goAdmin: () => this.set('admin'),
      onNavClick: (e) => {
        const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        const href = decodeURIComponent(a.getAttribute('href') || '');
        if (!/\.dc\.html/.test(href)) return;
        e.preventDefault();
        if (/Admin/i.test(href)) this.set('admin');
        else if (/Screens|Store/i.test(href)) this.set('store');
        else if (/Home/i.test(href)) this.set('home');
      }
    };
  }
}
</script>
