# Local development services. PHP runs on the host.
#   docker compose up -d
#
# Postgres is published on 5433 so it does not collide with a locally
# installed PostgreSQL on 5432.
#
# No Redis for now (owner, 2026-09-18): sessions, cache and queues run on PostgreSQL.

services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: touchwood
            POSTGRES_USER: touchwood
            POSTGRES_PASSWORD: secret
        ports:
            - "${FORWARD_DB_PORT:-5433}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U touchwood -d touchwood"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
