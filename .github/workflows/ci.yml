name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: touchwood
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: touchwood_test
        # pg_isready without a user asks as "root", which this server does not have: the log then
        # fills with "role root does not exist".
        options: >-
          --health-cmd "pg_isready -U touchwood -d touchwood_test"
          --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: touchwood
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gd (with AVIF and WebP), exif and fileinfo are needed for media uploads and image variants.
          # sockets is for the browser tests (pest-plugin-browser).
          extensions: pdo_pgsql, pgsql, intl, bcmath, mbstring, gd, exif, fileinfo, sockets
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      # --no-scripts: composer's post-autoload-dump boots Laravel (package:discover), and there is
      # no .env yet. The environment comes first, then the packages are discovered.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Install front-end dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi

      # Every page is an Inertia page, and the shell asks Vite for the built assets. Without a
      # manifest, @vite throws and a page is not a page at all - which is why ten feature tests
      # failed here while passing on a machine that had already run a build (2026-09-22).
      - name: Build assets
        run: npm run build

      # The browser suite drives a real Chromium. Without it, those tests error rather than fail,
      # which reads as a broken build instead of a missing dependency.
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # Order matters: style, then types, then BOUNDARIES, then tests.
      # Deptrac is blocking. A boundary violation fails the build even if
      # every test passes — retrofitting boundaries is what kills these.
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan level 8)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
      - name: Module boundaries (BLOCKING)
        run: vendor/bin/deptrac analyse --fail-on-uncovered --report-uncovered --no-progress
      - name: TypeScript
        run: npm run types
      - name: Tests
        # --ci makes a committed ->only() fail the run instead of silently skipping every other test.
        run: vendor/bin/pest --ci --exclude-testsuite=Browser

      # Their own step: they need a browser, they are slower than the rest put together, and a
      # Playwright server left over from the other suites reports its browsers as outdated when the
      # two run in one process (found by running it, 2026-09-22).
      - name: Browser tests
        run: vendor/bin/pest --testsuite=Browser
